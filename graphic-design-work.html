<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Graphic Design Showcase - Muhammad Ali</title>

  <!-- Slick Slider CSS -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"/>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet"/>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #fff;
      color: #000;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 90%;
      max-width: 1000px;
      margin: auto;
      padding: 50px 0;
    }

    h2 {
      font-size: 2.5rem;
      margin: 40px 0 20px;
      text-align: center;
      color: #FFD700;
    }

    .slider {
      width: 100%;
      margin: auto;
      padding: 10px 0;
    }

    .slider img {
      width: 100%;
      max-width: 600px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
    }

    .slick-prev:before,
    .slick-next:before {
      color: #FFD700;
      font-size: 30px;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #000;
      color: #fff;
    }

    @media (max-width: 768px) {
      h2 {
        font-size: 1.8rem;
      }

      .slider img {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Logos</h2>
    <div class="slider logos-slider">
      <div><img src="images/project/Daraz/Accountac.jpeg" alt=""></div>
      <div><img src="images/project/Daraz/Accountact Global1.jpeg" alt=""></div>
      <div><img src="images/project/Daraz/Gaming Logo.jpeg" alt=""></div>
      <div><img src="images/project/Daraz/InsuranceICON.jpeg" alt=""></div>
      <div><img src="images/project/Daraz/LawnCare1.jpeg" alt=""></div>
      <div><img src="images/project/Daraz/LawnCare2.jpeg" alt=""></div>
      <div><img src="images/project/Daraz/Pool1.jpeg" alt=""></div>
      <div><img src="images/project/Daraz/Wellspy1.jpeg" alt=""></div>
      <div><img src="images/project/Daraz/Wellspy2.jpeg" alt=""></div>
      <div><img src="images/project/Daraz/Wellspy3.jpeg" alt=""></div>
    </div>

    <h2>Thumbnails</h2>
    <div class="slider thumbnails-slider">
      <div><img src="images/thumbs/thumb1.jpg" alt="Thumbnail 1"></div>
      <div><img src="images/thumbs/thumb2.jpg" alt="Thumbnail 2"></div>
      <div><img src="images/thumbs/thumb3.jpg" alt="Thumbnail 3"></div>
    </div>

    <h2>Posts</h2>
    <div class="slider posts-slider">
      <div><img src="images/posts/post1.jpg" alt="Post 1"></div>
      <div><img src="images/posts/post2.jpg" alt="Post 2"></div>
      <div><img src="images/posts/post3.jpg" alt="Post 3"></div>
    </div>
  </div>
  
    <h2>Overlay's</h2>
    <div class="slider posts-slider">
      <div><img src="images/project/Daraz/Farooq Overlay Gaming1.jpeg" alt=""></div>
      <div><img src="images/posts/post1.jpg" alt="Post 1"></div>
      <div><img src="images/posts/post2.jpg" alt="Post 2"></div>
      <div><img src="images/posts/post3.jpg" alt="Post 3"></div>
    </div>
  </div>

  <div style="text-align: center; padding: 40px 0;">
  <a href="all-projects.html" style="margin: 10px; display: inline-block; padding: 12px 30px; background: #FFD700; color: #000; text-decoration: none; border-radius: 5px; font-weight: bold;">
    ← Back to Categories
  </a>
  <a href="index.html" style="margin: 10px; display: inline-block; padding: 12px 30px; background: #111; color: #fff; text-decoration: none; border-radius: 5px; font-weight: bold;">
    🏠 Go to Home
  </a>
</div>

  <footer>
    © 2025 Muhammad Ali. All Rights Reserved.
  </footer>

  <!-- jQuery + Slick JS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>

  <script>
    $(document).ready(function(){
      $('.logos-slider, .thumbnails-slider, .posts-slider').slick({
        infinite: true,
        slidesToShow: 1,
        slidesToScroll: 1,
        arrows: true,
        dots: false,
        autoplay: false,
      });
    });
  </script>
</body>
</html>
